<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Google Colab Plugin">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <!-- Rounded container with >=10% outer margin -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#bg)" stroke="#F59E0B" stroke-width="3.5"/>
  <!-- Linked Colab infinity-style twin arcs -->
  <path d="M52 46 A18 18 0 1 0 52 82" fill="none" stroke="url(#amber)" stroke-width="9" stroke-linecap="round"/>
  <path d="M76 46 A18 18 0 1 1 76 82" fill="none" stroke="#FDE68A" stroke-width="9" stroke-linecap="round"/>
  <!-- Center play/run bolt -->
  <polygon points="58,52 76,64 58,76" fill="#FFFFFF"/>
</svg>
